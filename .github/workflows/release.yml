name: Build Cross-Platform Releases (AppImage, EXE, DMG)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.0 libfuse2
          python -m pip install -r requirements.txt pyinstaller
      - name: Build Linux AppImage
        run: |
          chmod +x build-appimage.sh
          ./build-appimage.sh
      - name: Smoke test Linux AppImage across distros
        env:
          ONYXTUBE_DISABLE_DESKTOP_NOTIFY: "1"
        run: |
          ./dist/OnyxTube-x86_64.AppImage --appimage-extract-and-run --port 0 --smoke-ms 800
          for img in ubuntu:22.04 ubuntu:24.04 debian:bookworm fedora:41 archlinux:latest; do
            echo "=== Testing AppImage in $img ==="
            docker run --rm -v "${{ github.workspace }}/dist:/dist" -e ONYXTUBE_DISABLE_DESKTOP_NOTIFY=1 "$img" \
              /dist/OnyxTube-x86_64.AppImage --appimage-extract-and-run --port 0 --smoke-ms 800
          done
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxTube-Linux-x86_64.AppImage
          path: dist/OnyxTube-x86_64.AppImage

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Windows dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean `
            --name OnyxTube-Windows-x86_64 `
            --onefile `
            --windowed `
            --add-data "index.html;." `
            --add-data "app.js;." `
            --add-data "styles.css;." `
            --add-data "tokens.css;." `
            --add-data "onyxtube.svg;." `
            --hidden-import webview `
            --hidden-import yt_dlp `
            desktop.py
      - name: Smoke test built Windows EXE
        env:
          ONYXTUBE_DISABLE_DESKTOP_NOTIFY: "1"
        run: |
          .\dist\OnyxTube-Windows-x86_64.exe --port 0 --smoke-ms 1200
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxTube-Windows-x86_64.exe
          path: dist/OnyxTube-Windows-x86_64.exe

  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install macOS dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build macOS .app and .dmg
        run: |
          python -m PyInstaller --noconfirm --clean \
            --name OnyxTube \
            --windowed \
            --add-data "index.html:." \
            --add-data "app.js:." \
            --add-data "styles.css:." \
            --add-data "tokens.css:." \
            --add-data "onyxtube.svg:." \
            --hidden-import webview \
            --hidden-import yt_dlp \
            desktop.py
          hdiutil create -volname "OnyxTube" -srcfolder dist/OnyxTube.app -ov -format UDZO dist/OnyxTube-macOS.dmg
      - name: Smoke test built macOS DMG
        env:
          ONYXTUBE_DISABLE_DESKTOP_NOTIFY: "1"
        run: |
          hdiutil attach dist/OnyxTube-macOS.dmg -nobrowse -mountpoint /Volumes/OnyxTubeTest
          /Volumes/OnyxTubeTest/OnyxTube.app/Contents/MacOS/OnyxTube --port 0 --smoke-ms 1200
          hdiutil detach /Volumes/OnyxTubeTest
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxTube-macOS.dmg
          path: dist/OnyxTube-macOS.dmg

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-appimage, build-windows-exe, build-macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
