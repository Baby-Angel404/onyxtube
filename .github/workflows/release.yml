name: Build Cross-Platform Releases (AppImage, EXE, DMG)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libfuse2
          python -m pip install -r requirements.txt pyinstaller
      - name: Build Linux AppImage
        run: |
          chmod +x build-appimage.sh
          ./build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxTube-Linux-x86_64.AppImage
          path: dist/OnyxTube-x86_64.AppImage

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Windows dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean `
            --name OnyxTube-Windows-x86_64 `
            --onefile `
            --windowed `
            --add-data "index.html;." `
            --add-data "app.js;." `
            --add-data "styles.css;." `
            --add-data "tokens.css;." `
            --add-data "onyxtube.svg;." `
            --hidden-import webview `
            --hidden-import yt_dlp `
            desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxTube-Windows-x86_64.exe
          path: dist/OnyxTube-Windows-x86_64.exe

  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install macOS dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build macOS .app and .dmg
        run: |
          python -m PyInstaller --noconfirm --clean \
            --name OnyxTube \
            --windowed \
            --add-data "index.html:." \
            --add-data "app.js:." \
            --add-data "styles.css:." \
            --add-data "tokens.css:." \
            --add-data "onyxtube.svg:." \
            --hidden-import webview \
            --hidden-import yt_dlp \
            desktop.py
          hdiutil create -volname "OnyxTube" -srcfolder dist/OnyxTube.app -ov -format UDZO dist/OnyxTube-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxTube-macOS.dmg
          path: dist/OnyxTube-macOS.dmg

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-appimage, build-windows-exe, build-macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
