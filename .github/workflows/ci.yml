name: OnyxTube Cross-Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax and compile checks
        run: |
          node --check app.js
          python -m py_compile desktop.py server.py test_e2e.py

      - name: Cross-platform server and desktop smoke test
        env:
          ONYXTUBE_DISABLE_DESKTOP_NOTIFY: "1"
        run: |
          python desktop.py --backend browser --port 0 --smoke-ms 500
          python -c "import server, urllib.request; srv, port = server.start_background_server('127.0.0.1', 0); r = urllib.request.urlopen(f'http://127.0.0.1:{port}/api/ytdlp', timeout=15); assert r.status == 200; srv.shutdown(); srv.server_close(); print('SERVER_SMOKE_OK', port)"

  test-linux-distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu:22.04
            install: "apt-get update && apt-get install -y python3 yt-dlp"
          - distro: ubuntu:24.04
            install: "apt-get update && apt-get install -y python3 yt-dlp"
          - distro: debian:bookworm
            install: "apt-get update && apt-get install -y python3 yt-dlp"
          - distro: fedora:41
            install: "dnf install -y python3 yt-dlp"
          - distro: archlinux:latest
            install: "pacman -Syu --noconfirm python yt-dlp"
    steps:
      - uses: actions/checkout@v4
      - name: Run OnyxTube smoke test in ${{ matrix.distro }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" -w /app \
            -e ONYXTUBE_DISABLE_DESKTOP_NOTIFY=1 \
            "${{ matrix.distro }}" bash -lc "
              set -e
              ${{ matrix.install }}
              python3 -m py_compile desktop.py server.py
              python3 desktop.py --port 0 --smoke-ms 500
              python3 -c \"import server, urllib.request; srv, port = server.start_background_server('127.0.0.1', 0); assert urllib.request.urlopen(f'http://127.0.0.1:{port}/api/ytdlp', timeout=15).status == 200; assert urllib.request.urlopen(f'http://127.0.0.1:{port}/index.html', timeout=15).status == 200; srv.shutdown(); srv.server_close(); print('DISTRO_OK:', '${{ matrix.distro }}')\"
            "
